; Compilation avec PlatformIO :  pio run
; (utilisé par les tests GitHub et par Wokwi pour VS Code)
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    beegee-tokyo/DHT sensor library for ESPx@^1.19
