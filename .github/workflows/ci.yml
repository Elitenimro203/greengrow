# À chaque push et chaque pull request, GitHub installe le projet sur une
# machine neuve et lance les tests. Si un test casse, on le voit avant de fusionner.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Les migrations créent bien la base
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Tests
        run: pytest -q

  broker:
    # La sécurité du broker est testée pour de vrai : on démarre Mosquitto
    # et des "attaquants" essaient de tricher (voir tests/test_broker_real.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Certificats et secrets jetables
        run: |
          python scripts/make_dev_certs.py
          {
            echo "MQTT_ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            echo "MQTT_BACKEND_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          } > .env
      - name: Démarrer le broker
        run: docker compose up -d --wait
      - name: Tests de sécurité contre le vrai broker
        run: pytest tests/test_broker_real.py -v
        env:
          GREENGROW_BROKER_TEST: "1"
      - name: Journal du broker en cas d'échec
        if: failure()
        run: docker compose logs mosquitto

  firmware:
    # 1. La logique d'arrosage est testée sur le PC de GitHub, sans ESP32.
    # 2. Le firmware complet est compilé pour ESP32 : une erreur de code
    #    se voit ici, avant d'ouvrir Wokwi.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de la logique (arrosage, garde-fous, commandes)
        working-directory: firmware/tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -o test_logic test_logic.cpp
          ./test_logic
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/greengrow_bac/platformio.ini') }}
      - name: Compilation du firmware pour ESP32
        working-directory: firmware/greengrow_bac
        run: |
          pip install platformio
          cp secrets.example.h secrets.h
          pio run
