# GreenGrow — services locaux
# Lancement : docker compose up -d      Arrêt : docker compose down
# (docker compose lit automatiquement le fichier .env à côté de ce fichier)

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Renseigne MQTT_ADMIN_PASSWORD dans .env}
    ports:
      - "8883:8883"   # MQTT chiffré uniquement
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data   # comptes et messages en attente

volumes:
  mosquitto-data:
