# ============================================================
# GreenGrow — Configuration du broker Mosquitto
# ============================================================

# Personne ne se connecte sans compte.
allow_anonymous false

# Les comptes et leurs droits sont gérés par le plugin "dynamic security" :
# le backend peut créer le compte d'un bac à chaud, sans redémarrer le broker.
# Les mots de passe y sont stockés hachés, jamais en clair.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# UN SEUL port d'écoute : 8883, chiffré en TLS.
# Il n'y a volontairement aucun "listener 1883" : le MQTT en clair n'existe pas.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Les messages QoS 1 en attente survivent à un redémarrage du broker.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
